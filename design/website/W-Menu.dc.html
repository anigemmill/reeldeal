<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mobile menu</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&amp;family=Inter:wght@400;500;600&amp;family=Geist+Mono:wght@400;500&amp;family=Instrument+Serif:ital@0;1&amp;display=swap">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}
button{font:inherit;cursor:pointer}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; overflow: hidden; font-family: 'Inter', sans-serif; background: #1A1A1A; color: #F5F8FF; display: flex; flex-direction: column; padding: 20px;">
  <header style="display: flex; justify-content: space-between; align-items: center;">
    <span style="display: flex; align-items: center; gap: 9px; font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 19px;">
      <span style="position: relative; width: 24px; height: 24px; display: inline-block;" aria-hidden="true">
        <span style="position: absolute; left: 0; top: 0; width: 16px; height: 16px; border-radius: 5px; background: linear-gradient(135deg, #007BFF 0%, #FFE6D0 30%, #FF5A00 55%, #6A3AA8 78%, #2038E2 100%);"></span>
        <span style="position: absolute; right: 0; bottom: 0; width: 16px; height: 16px; border-radius: 5px; border: 2px solid #F5F8FF; box-sizing: border-box;"></span>
      </span>
      Reeldeal
    </span>
    <a href="W-Home.dc.html" aria-label="Close menu" style="width: 44px; height: 44px; border-radius: 50%; background: #F5F8FF; color: #1A1A1A; display: flex; align-items: center; justify-content: center;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></a>
  </header>

  <nav aria-label="Main" style="margin-top: 48px; display: flex; flex-direction: column; align-items: flex-start; gap: 2px;">
    <sc-for list="{{links}}" as="l" hint-placeholder-count="6">
      <a href="{{l.href}}" onMouseEnter="{{l.hover}}" style="padding: 2px 14px; margin-left: -14px; border-radius: 16px; background: {{l.bg}}; color: {{l.fg}}; font-family: 'Space Grotesk', sans-serif; font-weight: 600; font-size: 46px; line-height: 1.12; letter-spacing: -0.04em;">{{l.t}}</a>
    </sc-for>
  </nav>

  <div style="margin-top: auto; display: flex; flex-direction: column; gap: 16px;">
    <div style="display: flex; gap: 8px;" aria-hidden="true">
      <div style="position: relative; flex: 1; height: 96px; border-radius: 14px; overflow: hidden;"><dc-import name="Scene" variant="lake" hint-size="100%,100%"></dc-import></div>
      <div style="position: relative; flex: 1; height: 96px; border-radius: 14px; overflow: hidden;"><dc-import name="Scene" variant="geyser" hint-size="100%,100%"></dc-import></div>
      <div style="position: relative; flex: 1; height: 96px; border-radius: 14px; overflow: hidden;"><dc-import name="Scene" variant="coast" hint-size="100%,100%"></dc-import></div>
    </div>
    <div style="display: flex; gap: 8px;">
      <a href="W-Auth.dc.html" style="flex: 1; padding: 16px; border-radius: 999px; background: #2038E2; color: #FFFFFF; font-weight: 600; text-align: center;">Start free</a>
      <a href="W-Demo.dc.html" style="flex: 1; padding: 16px; border-radius: 999px; border: 1px solid #33394A; text-align: center;">Book a demo</a>
    </div>
    <a href="W-Auth.dc.html" style="text-align: center; padding: 8px; font-size: 15px; color: #B8C2D9;">Sign in</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
const L = [['Product', 'W-Product.dc.html'], ['Solutions', 'W-Solutions.dc.html'], ['Showcase', 'W-Showcase.dc.html'], ['Pricing', 'W-Pricing.dc.html'], ['About', 'W-About.dc.html'], ['Contact', 'W-Demo.dc.html']];
class Component extends DCLogic {
  constructor(p){ super(p); this.state = { a: 2 }; }
  renderVals() {
    return { links: L.map(([t, href], i) => ({ t, href, bg: i === this.state.a ? '#8FC2FF' : 'transparent', fg: i === this.state.a ? '#1A1A1A' : '#F5F8FF', hover: () => this.setState({ a: i }) })) };
  }
}
</script>
</body>
</html>
