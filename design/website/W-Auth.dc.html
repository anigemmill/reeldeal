<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Reeldeal — Sign in</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&amp;family=Inter:wght@400;500;600&amp;family=Geist+Mono:wght@400;500&amp;family=Instrument+Serif:ital@0;1&amp;display=swap">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}a:hover{opacity:.85}
button{font:inherit;cursor:pointer}
input{font:inherit}
</style>
</helmet>
<div style="font-family: 'Inter', sans-serif; background: #FFFFFF; color: #1A1A1A; min-height: 960px; display: flex; flex-wrap: wrap;">
  <main style="flex: 1 1 480px; min-width: 0; padding: 32px clamp(20px, 5vw, 72px); box-sizing: border-box; display: flex; flex-direction: column;">
    <a href="W-Home.dc.html" style="display: flex; align-items: center; gap: 10px; font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 21px; letter-spacing: -0.02em;">
      <span style="position: relative; width: 26px; height: 26px; display: inline-block;" aria-hidden="true">
        <span style="position: absolute; left: 0; top: 0; width: 18px; height: 18px; border-radius: 6px; background: linear-gradient(135deg, #007BFF 0%, #FFE6D0 30%, #FF5A00 55%, #6A3AA8 78%, #2038E2 100%);"></span>
        <span style="position: absolute; right: 0; bottom: 0; width: 18px; height: 18px; border-radius: 6px; border: 2px solid #1A1A1A; box-sizing: border-box;"></span>
      </span>
      Reeldeal
    </a>
    <div style="margin: auto 0; max-width: 440px; width: 100%; padding: 48px 0;">
      <div role="tablist" aria-label="Account" style="display: inline-flex; gap: 2px; padding: 4px; border-radius: 999px; background: #FFFFFF; border: 1px solid #DCE6F5; margin-bottom: 32px;">
        <button type="button" role="tab" aria-selected="{{inSel}}" onClick="{{showIn}}" style="border: 0; padding: 10px 18px; border-radius: 999px; background: {{inBg}}; color: {{inFg}}; font-weight: 500;">Sign in</button>
        <button type="button" role="tab" aria-selected="{{upSel}}" onClick="{{showUp}}" style="border: 0; padding: 10px 18px; border-radius: 999px; background: {{upBg}}; color: {{upFg}}; font-weight: 500;">Create account</button>
      </div>
      <h1 style="margin: 0 0 10px; font-family: 'Space Grotesk', sans-serif; font-size: 48px; line-height: 1; letter-spacing: -0.04em; font-weight: 600;">{{title}}</h1>
      <p style="margin: 0 0 28px; font-size: 16px; color: #4B5563;">{{sub}}</p>
      <button type="button" style="width: 100%; display: flex; justify-content: center; align-items: center; gap: 10px; padding: 14px; border-radius: 14px; border: 1px solid #D4E0F2; background: #FFFFFF; color: #1A1A1A; font-weight: 500; margin-bottom: 10px;"><span style="width: 18px; height: 18px; border-radius: 50%; border: 2px solid #1A1A1A; box-sizing: border-box;" aria-hidden="true"></span>Continue with Google</button>
      <div style="display: flex; align-items: center; gap: 12px; margin: 18px 0; font-size: 13px; color: #4B5563;"><span style="flex: 1; height: 1px; background: #DCE6F5;"></span>or with email<span style="flex: 1; height: 1px; background: #DCE6F5;"></span></div>
      <form style="display: flex; flex-direction: column; gap: 14px;">
        <sc-if value="{{isUp}}" hint-placeholder-val="{{false}}">
          <label style="display: flex; flex-direction: column; gap: 7px; font-size: 14px; font-weight: 500;">Business name<input type="text" style="padding: 13px 14px; border-radius: 12px; border: 1px solid #D4E0F2; background: #FFFFFF; color: #1A1A1A;"></label>
        </sc-if>
        <label style="display: flex; flex-direction: column; gap: 7px; font-size: 14px; font-weight: 500;">Email<input type="email" style="padding: 13px 14px; border-radius: 12px; border: 1px solid #D4E0F2; background: #FFFFFF; color: #1A1A1A;"></label>
        <label style="display: flex; flex-direction: column; gap: 7px; font-size: 14px; font-weight: 500;">Password<input type="password" style="padding: 13px 14px; border-radius: 12px; border: 1px solid #D4E0F2; background: #FFFFFF; color: #1A1A1A;"></label>
        <sc-if value="{{isIn}}" hint-placeholder-val="{{true}}"><a href="#" style="align-self: flex-end; font-size: 14px; text-decoration: underline;">Forgot password?</a></sc-if>
        <button type="button" style="margin-top: 6px; padding: 16px; border-radius: 999px; border: 0; background: #1A1A1A; color: #F5F8FF; font-weight: 600; font-size: 16px;">{{cta}}</button>
        <sc-if value="{{isUp}}" hint-placeholder-val="{{false}}"><p style="margin: 0; font-size: 13px; line-height: 1.5; color: #4B5563;">By creating an account you agree to the <a href="#" style="text-decoration: underline;">Terms</a> and <a href="#" style="text-decoration: underline;">Privacy policy</a>.</p></sc-if>
      </form>
    </div>
    <p style="margin: 0; font-size: 13px; color: #4B5563;">Need help? <a href="W-Demo.dc.html" style="text-decoration: underline;">Contact us</a></p>
  </main>

  <aside style="flex: 1 1 480px; min-width: 0; min-height: 600px; position: relative; overflow: hidden; background: #1A1A1A; color: #F5F8FF; margin: 12px; border-radius: 28px;" aria-label="Made on Reeldeal">
    <div style="position: absolute; inset: -10% -20%; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; transform: rotate(-8deg);" aria-hidden="true">
      <sc-for list="{{tiles}}" as="t">
        <div style="position: relative; height: 230px; border-radius: 16px; overflow: hidden; margin-top: {{t.m}}; opacity: 0.9;"><dc-import name="Scene" variant="{{t.v}}" hint-size="100%,100%"></dc-import></div>
      </sc-for>
    </div>
    <div style="position: absolute; inset: 0; background: linear-gradient(180deg, rgba(26,26,26,0) 30%, rgba(26,26,26,0.92) 78%);"></div>
    <div style="position: absolute; left: 40px; right: 40px; bottom: 40px;">
      <div style="height: 6px; width: 120px; border-radius: 999px; background: linear-gradient(90deg, #DDEBFF, #8FC2FF, #007BFF, #2038E2); margin-bottom: 22px;"></div>
      <p style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: clamp(30px, 3vw, 44px); line-height: 1.02; letter-spacing: -0.03em; font-weight: 600;">Your footage is waiting. <span style="font-family: 'Instrument Serif', serif; font-style: italic; font-weight: 400;">Let’s make something.</span></p>
    </div>
  </aside>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":960}}'>
class Component extends DCLogic {
  constructor(p){ super(p); this.state = { up: false }; }
  renderVals() {
    const up = this.state.up;
    const vs = ['lake', 'night', 'forest', 'coast', 'dawn', 'geyser', 'coast', 'lake', 'geyser', 'forest', 'night', 'dawn', 'forest', 'lake', 'dawn', 'coast'];
    return {
      isUp: up, isIn: !up,
      inSel: String(!up), upSel: String(up),
      inBg: up ? 'transparent' : '#1A1A1A', inFg: up ? '#1A1A1A' : '#F5F8FF',
      upBg: up ? '#1A1A1A' : 'transparent', upFg: up ? '#F5F8FF' : '#1A1A1A',
      showIn: () => this.setState({ up: false }), showUp: () => this.setState({ up: true }),
      title: up ? 'Start free' : 'Welcome back',
      sub: up ? 'No card needed. Your first videos are on us.' : 'Sign in to your workspace.',
      cta: up ? 'Create account' : 'Sign in',
      tiles: vs.map((v, i) => ({ v, m: (i % 4 === 1 || i % 4 === 3) ? '60px' : '0px' }))
    };
  }
}
</script>
</body>
</html>
