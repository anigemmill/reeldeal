<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Concept B — Horizon</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&amp;family=Inter:wght@400;500;600&amp;family=Geist+Mono:wght@400;500&amp;family=Instrument+Serif:ital@0;1&amp;display=swap">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}a:hover{opacity:.85}
@keyframes mqLeft{from{transform:translateX(0)}to{transform:translateX(-50%)}}
@keyframes mqRight{from{transform:translateX(-50%)}to{transform:translateX(0)}}
@keyframes caret{50%{opacity:0}}
@media (prefers-reduced-motion: reduce){.mv{animation:none !important}}
</style>
</helmet>
<div style="font-family: 'Inter', sans-serif; background: #1A1A1A; color: #1A1A1A; overflow-x: hidden;">
  <section style="background: linear-gradient(180deg, #FFFFFF 0%, #EEF5FF 18%, #BFDBFF 34%, #8FC2FF 46%, #007BFF 62%, #2038E2 78%, #1A1A1A 100%); padding-bottom: 96px;">
    <header style="max-width: 1360px; margin: 0 auto; padding: 22px clamp(20px, 4vw, 40px); box-sizing: border-box; display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 14px;">
      <span style="display: flex; align-items: center; gap: 10px; font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 21px;"><span style="position: relative; width: 26px; height: 26px; display: inline-block;" aria-hidden="true"><span style="position: absolute; left: 0; top: 0; width: 18px; height: 18px; border-radius: 6px; background: linear-gradient(135deg, #007BFF 0%, #FFE6D0 30%, #FF5A00 55%, #6A3AA8 78%, #2038E2 100%);"></span><span style="position: absolute; right: 0; bottom: 0; width: 18px; height: 18px; border-radius: 6px; border: 2px solid #1A1A1A; box-sizing: border-box;"></span></span>Reeldeal</span>
      <nav aria-label="Main" style="display: flex; gap: 22px; font-size: 14px; font-weight: 500;"><a href="#">Product</a><a href="#">Solutions</a><a href="#">Showcase</a><a href="#">Pricing</a></nav>
      <a href="#" style="padding: 11px 18px; border-radius: 999px; background: #1A1A1A; color: #FFFFFF; font-size: 14px; font-weight: 600;">Start free</a>
    </header>
    <div style="max-width: 1360px; margin: 0 auto; padding: 80px clamp(20px, 4vw, 40px) 0; box-sizing: border-box; text-align: center;">
      <h1 style="margin: 0 auto; max-width: 1100px; font-family: 'Space Grotesk', sans-serif; font-size: clamp(56px, 8.4vw, 132px); line-height: 0.9; letter-spacing: -0.055em; font-weight: 600;">From first light <span style="font-family: 'Instrument Serif', serif; font-style: italic; font-weight: 400; letter-spacing: -0.03em;">to last post.</span></h1>
      <p style="margin: 28px auto 0; max-width: 560px; font-size: 19px; line-height: 1.55; color: #1F2A44;">Shoot all day. Describe what you need tonight. Wake up to finished, on-brand videos for every channel.</p>
      <div style="max-width: 600px; margin: 36px auto 0; display: flex; align-items: center; gap: 12px; padding: 8px 8px 8px 22px; border-radius: 999px; background: rgba(255,255,255,0.9); box-shadow: 0 20px 60px rgba(32,56,226,0.25); text-align: left;">
        <span style="flex: 1; min-width: 0; font-size: 18px; white-space: nowrap; overflow: hidden;">{{typed}}<span class="mv" style="display: inline-block; width: 2px; height: 20px; margin-left: 2px; vertical-align: -3px; background: #1A1A1A; animation: caret 1s steps(1) infinite;"></span></span>
        <a href="#" aria-label="Create this video" style="flex: none; width: 46px; height: 46px; border-radius: 50%; background: #FF5A00; color: #1A1A1A; display: flex; align-items: center; justify-content: center;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5"></path><polyline points="6 11 12 5 18 11"></polyline></svg></a>
      </div>
    </div>
    <div style="margin-top: 120px; overflow: hidden;" aria-label="Videos made on the platform">
      <div class="mv" style="display: inline-flex; gap: 16px; animation: mqLeft 60s linear infinite;">
        <sc-for list="{{strip}}" as="t" hint-placeholder-count="16">
          <figure style="margin: 0; flex: none; width: {{t.w}};">
            <div style="position: relative; height: 360px; border-radius: 18px; overflow: hidden; box-shadow: 0 30px 60px rgba(0,0,0,0.35);"><dc-import name="Scene" variant="{{t.v}}" hint-size="100%,100%"></dc-import></div>
            <figcaption style="margin-top: 12px; display: flex; justify-content: space-between; gap: 8px; color: #FFFFFF; font-size: 14px;"><span style="font-weight: 600;">{{t.title}}</span><span style="font-family: 'Geist Mono', monospace; font-size: 11px; color: #CFE3FF;">{{t.meta}}</span></figcaption>
          </figure>
        </sc-for>
      </div>
    </div>
  </section>

  <section style="background: #1A1A1A; padding: 40px 0 112px; overflow: hidden;" aria-label="Reels, stories, ads and websites, in minutes not weeks">
    <sc-for list="{{rows}}" as="r" hint-placeholder-count="2">
      <div style="overflow: hidden; white-space: nowrap;" aria-hidden="true">
        <div class="mv" style="display: inline-flex; animation: {{r.anim}};">
          <sc-for list="{{r.items}}" as="it"><span style="font-family: {{it.f}}; font-style: {{it.st}}; font-weight: {{it.fw}}; font-size: clamp(64px, 9vw, 140px); line-height: 1.05; letter-spacing: -0.045em; padding-right: 0.35em; color: {{it.c}}; background: {{it.bg}}; -webkit-background-clip: {{it.clip}}; background-clip: {{it.clip}};">{{it.w}}</span></sc-for>
        </div>
      </div>
    </sc-for>
    <div style="max-width: 1360px; margin: 72px auto 0; padding: 0 clamp(20px, 4vw, 40px); box-sizing: border-box; display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 14px; color: #FFFFFF;">
      <sc-for list="{{cards}}" as="c" hint-placeholder-count="3">
        <div style="padding: 28px; border-radius: 24px; background: #232323; border: 1px solid #2F3A55;">
          <span style="display: block; width: 44px; height: 6px; border-radius: 999px; background: {{c.bar}}; margin-bottom: 40px;"></span>
          <h3 style="margin: 0 0 8px; font-family: 'Space Grotesk', sans-serif; font-size: 24px; font-weight: 600;">{{c.t}}</h3>
          <p style="margin: 0; font-size: 15px; line-height: 1.55; color: #B8C2D9;">{{c.d}}</p>
        </div>
      </sc-for>
    </div>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1900}}'>
const SKY = 'linear-gradient(90deg, #FFFFFF 0%, #DDEBFF 20%, #8FC2FF 42%, #007BFF 66%, #2038E2 100%)';
const T = [
  { v: 'dawn', w: '260px', title: 'Ridge Walks', meta: '9:16' }, { v: 'lake', w: '520px', title: 'Lakeside Lodge', meta: '16:9' },
  { v: 'forest', w: '260px', title: 'Canopy Tours', meta: '9:16' }, { v: 'coast', w: '360px', title: 'Bay Sail Charters', meta: '1:1' },
  { v: 'geyser', w: '260px', title: 'Hot Pools Spa', meta: '9:16' }, { v: 'night', w: '520px', title: 'Rooftop Bar', meta: '16:9' },
  { v: 'lake', w: '260px', title: 'Kayak Hire', meta: '9:16' }, { v: 'dawn', w: '360px', title: 'Alpine Retreat', meta: '1:1' }
];
const PH = ['Weekend getaway reel for Instagram', 'Tonight’s sunset cruise, 20 seconds', 'Website hero video for the lodge'];
class Component extends DCLogic {
  constructor(p){ super(p); this.state = { pi: 0, ci: 0, hold: 0 }; }
  componentDidMount(){
    let reduce = false;
    try { reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) {}
    if (reduce) { this.setState({ ci: 99 }); return; }
    this.timer = setInterval(() => {
      let { pi, ci, hold } = this.state; const len = PH[pi].length;
      if (ci < len) ci += 1; else if (hold < 40) hold += 1; else { pi = (pi + 1) % PH.length; ci = 0; hold = 0; }
      this.setState({ pi, ci, hold });
    }, 65);
  }
  componentWillUnmount(){ clearInterval(this.timer); }
  renderVals() {
    const g = (w) => ({ w, f: "'Space Grotesk', sans-serif", st: 'normal', fw: '700', c: 'transparent', bg: SKY, clip: 'text' });
    const s = (w) => ({ w, f: "'Instrument Serif', serif", st: 'italic', fw: '400', c: '#FFFFFF', bg: 'none', clip: 'border-box' });
    const dbl = (a) => a.concat(a);
    return {
      typed: PH[this.state.pi].slice(0, this.state.ci),
      strip: T.concat(T),
      rows: [
        { anim: 'mqLeft 32s linear infinite', items: dbl([g('Reels'), s('stories,'), g('Ads'), s('and'), g('Websites')]) },
        { anim: 'mqRight 28s linear infinite', items: dbl([s('in minutes,'), g('not weeks.'), s('in minutes,'), g('not weeks.')]) }
      ],
      cards: [
        { t: 'Autopilot', d: 'Upload, describe, approve. On your phone, between guests.', bar: 'linear-gradient(90deg, #FFFFFF, #8FC2FF)' },
        { t: 'Studio', d: 'Every cut in your hands, with an assistant that edits on request.', bar: 'linear-gradient(90deg, #8FC2FF, #007BFF)' },
        { t: 'Brand intelligence', d: 'Your look, applied to every video, automatically.', bar: 'linear-gradient(90deg, #007BFF, #2038E2)' }
      ]
    };
  }
}
</script>
</body>
</html>
