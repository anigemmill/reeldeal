<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Autopilot — Review options</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&amp;family=Inter:wght@400;500;600&amp;family=Sora:wght@400;600;700&amp;family=DM+Sans:wght@400;500;600&amp;family=Manrope:wght@400;500;600;700;800&amp;family=Geist+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}a:hover{opacity:.85}
button{font:inherit;cursor:pointer}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; overflow: hidden; font-family: {{t.b}}; background: {{c.bg}}; color: {{c.ink}}; display: flex; flex-direction: column; font-size: 14px;">
  <header style="display: flex; justify-content: space-between; align-items: center; padding: 20px 20px 10px;">
    <a href="AutopilotBrief.dc.html" aria-label="Back to brief" style="width: 44px; height: 44px; border-radius: 50%; border: 1px solid {{c.ln}}; background: {{c.sf}}; display: flex; align-items: center; justify-content: center;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="15 6 9 12 15 18"></polyline></svg></a>
    <span style="font-family: {{t.h}}; font-weight: 600; font-size: 17px;">3 options ready</span>
    <a href="Studio.dc.html" style="padding: 10px 12px; border-radius: 12px; font-size: 13px; font-weight: 600; text-decoration: underline;">Studio</a>
  </header>

  <div style="display: flex; justify-content: center; padding: 6px 0 14px;">
    <div style="position: relative; width: 248px; height: 440px; border-radius: 22px; overflow: hidden;">
      <dc-import name="Scene" variant="{{cur.v}}" hint-size="100%,100%"></dc-import>
      <span style="position: absolute; top: 12px; left: 12px; padding: 5px 9px; border-radius: 999px; background: rgba(0,0,0,0.55); color: #FFFFFF; font-family: {{mono}}; font-size: 11px;">{{cur.tag}}</span>
      <div style="position: absolute; left: 16px; right: 16px; bottom: 64px; color: #FFFFFF; font-family: {{t.h}}; font-weight: 700; font-size: 26px; line-height: 1.02; letter-spacing: -0.02em; text-shadow: 0 2px 14px rgba(0,0,0,0.4);">{{cur.hook}}</div>
      <button type="button" aria-label="Play option" style="position: absolute; left: 50%; top: 42%; margin: -28px 0 0 -28px; width: 56px; height: 56px; border-radius: 50%; border: 0; background: rgba(255,255,255,0.92); color: #111111; display: flex; align-items: center; justify-content: center;"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><polygon points="7 4 20 12 7 20 7 4"></polygon></svg></button>
      <div style="position: absolute; left: 16px; right: 16px; bottom: 18px; height: 4px; border-radius: 999px; background: rgba(255,255,255,0.35);"><div style="width: 34%; height: 4px; border-radius: 999px; background: #FFFFFF;"></div></div>
    </div>
  </div>

  <div role="radiogroup" aria-label="Choose an option" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; padding: 0 20px;">
    <sc-for list="{{opts}}" as="o" hint-placeholder-count="3">
      <button type="button" role="radio" aria-checked="{{o.checked}}" onClick="{{o.pick}}" style="padding: 6px; border-radius: 14px; background: {{c.sf}}; border: {{o.border}}; color: {{c.ink}}; text-align: left; display: flex; flex-direction: column; gap: 6px;">
        <span style="position: relative; display: block; height: 52px; border-radius: 9px; overflow: hidden;"><dc-import name="Scene" variant="{{o.v}}" hint-size="100%,100%"></dc-import></span>
        <span style="font-size: 12px; font-weight: 600; padding: 0 2px;">{{o.l}}</span>
      </button>
    </sc-for>
  </div>

  <div style="display: flex; gap: 8px; overflow-x: auto; padding: 14px 20px 0;">
    <sc-for list="{{chips}}" as="ch" hint-placeholder-count="4">
      <button type="button" style="flex: none; padding: 10px 14px; min-height: 40px; border-radius: 999px; border: 1px solid {{c.ln}}; background: transparent; color: {{c.ink}}; font-size: 13px;">{{ch.l}}</button>
    </sc-for>
  </div>

  <div style="margin-top: auto; padding: 16px 20px 28px; display: flex; flex-direction: column; gap: 8px;">
    <button type="button" style="padding: 18px; border-radius: 18px; border: 0; background: {{c.ac}}; color: {{c.on}}; font-weight: 600; font-size: 16px;">Approve and export</button>
    <div style="display: flex; gap: 8px;">
      <button type="button" style="flex: 1; padding: 14px; border-radius: 16px; border: 1px solid {{c.ln}}; background: {{c.sf}}; color: {{c.ink}}; font-weight: 500;">Request changes</button>
      <a href="Studio.dc.html" style="flex: 1; padding: 14px; border-radius: 16px; border: 1px solid {{c.ln}}; background: {{c.sf}}; font-weight: 500; text-align: center;">Open in Studio</a>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"palette":{"editor":"enum","options":["01 · Cream / Blue / Orange","02 · June Bud / Orange / Dark Blue","03 · Tangerine / Pistachio / Retro Green","04 · Altitude","05 · Electric Blue / Orange / Charcoal","06 · Fold / Bone White / Blue"],"default":"01 · Cream / Blue / Orange","section":"Theme"},"mode":{"editor":"enum","options":["Light Workspace","Dark Studio"],"default":"Light Workspace","section":"Theme"},"type":{"editor":"enum","options":["A · Space Grotesk + Inter","B · Sora + DM Sans","C · Manrope"],"default":"A · Space Grotesk + Inter","section":"Theme"},"$preview":{"width":390,"height":844}}'>
const P={
'01':{L:{bg:'#F6EFE7',sf:'#FFFFFF',sf2:'#EFE4D8',ink:'#1E2533',mu:'#5A6275',ln:'#E2D6C9',ac:'#F4721E',on:'#1E2533',ac2:'#4D6080',on2:'#FFFFFF',tint:'#E9D9CA'},D:{bg:'#12151C',sf:'#1B202B',sf2:'#252B38',ink:'#F3ECE4',mu:'#A5ADBD',ln:'#2E3546',ac:'#F4721E',on:'#1E2533',ac2:'#8FA3C6',on2:'#12151C',tint:'#E9D9CA'}},
'02':{L:{bg:'#F7F3E9',sf:'#FFFFFF',sf2:'#EFE7D4',ink:'#12063F',mu:'#574F70',ln:'#E5DCC6',ac:'#1A0088',on:'#FFFFFF',ac2:'#FF5832',on2:'#12063F',tint:'#B4D34F'},D:{bg:'#0D0726',sf:'#170E3A',sf2:'#22184D',ink:'#F4EFE2',mu:'#ABA4C4',ln:'#2E2459',ac:'#B4D34F',on:'#12063F',ac2:'#FF5832',on2:'#0D0726',tint:'#B4D34F'}},
'03':{L:{bg:'#F4F3E4',sf:'#FFFFFF',sf2:'#E9E8CA',ink:'#0F2A1B',mu:'#4F5E54',ln:'#DEDDBF',ac:'#006732',on:'#FFFFFF',ac2:'#FE7A25',on2:'#0F2A1B',tint:'#E9E8CA'},D:{bg:'#0B140F',sf:'#121F18',sf2:'#1A2B21',ink:'#EEEDD6',mu:'#A3AE9F',ln:'#24382C',ac:'#FE7A25',on:'#0B140F',ac2:'#3FA36B',on2:'#0B140F',tint:'#E9E8CA'}},
'04':{L:{bg:'#F8F1F5',sf:'#FFFFFF',sf2:'#F2E6EE',ink:'#0B0838',mu:'#57546F',ln:'#E6D8E1',ac:'#0033FF',on:'#FFFFFF',ac2:'#977DFF',on2:'#0B0838',tint:'#F2E6EE'},D:{bg:'#08072B',sf:'#100E3D',sf2:'#1A1752',ink:'#F2E6EE',mu:'#ACA6CC',ln:'#26236A',ac:'#977DFF',on:'#08072B',ac2:'#5C7BFF',on2:'#08072B',tint:'#F2E6EE'}},
'05':{L:{bg:'#FFF6EF',sf:'#FFFFFF',sf2:'#FFE4D0',ink:'#191919',mu:'#5C5C5C',ln:'#F0DCCB',ac:'#2636F5',on:'#FFFFFF',ac2:'#FF5A00',on2:'#191919',tint:'#FFE4D0'},D:{bg:'#191919',sf:'#222222',sf2:'#2C2C2C',ink:'#F5F0EC',mu:'#A8A8A8',ln:'#363636',ac:'#FF5A00',on:'#191919',ac2:'#087BFF',on2:'#0B0B0B',tint:'#FFE4D0'}},
'06':{L:{bg:'#F5F5F5',sf:'#FFFFFF',sf2:'#ECECEC',ink:'#141414',mu:'#5E5E5E',ln:'#E3E3E3',ac:'#2860FF',on:'#FFFFFF',ac2:'#FF6500',on2:'#141414',tint:'#F7B34B'},D:{bg:'#101114',sf:'#18191D',sf2:'#222328',ink:'#F5F5F5',mu:'#A3A3A8',ln:'#2E2F35',ac:'#F7B34B',on:'#141414',ac2:'#5A85FF',on2:'#101114',tint:'#F7B34B'}}};
const T={A:{h:"'Space Grotesk', sans-serif",b:"'Inter', sans-serif"},B:{h:"'Sora', sans-serif",b:"'DM Sans', sans-serif"},C:{h:"'Manrope', sans-serif",b:"'Manrope', sans-serif"}};
const MONO="'Geist Mono', ui-monospace, monospace";
const OPTS=[
  { v: 'lake', l: '1 · Calm', tag: 'OPTION 1 · 0:30 · 9:16', hook: 'Wake up to this.' },
  { v: 'forest', l: '2 · Energetic', tag: 'OPTION 2 · 0:30 · 9:16', hook: 'Your summer starts here.' },
  { v: 'dawn', l: '3 · Story', tag: 'OPTION 3 · 0:30 · 9:16', hook: 'One morning at the lodge.' }
];
class Component extends DCLogic {
  constructor(p){ super(p); this.state = { sel: 0 }; }
  renderVals() {
    const pal = P[String(this.props.palette ?? '01').slice(0, 2)] || P['01'];
    const c = (this.props.mode ?? 'Light Workspace') === 'Dark Studio' ? pal.D : pal.L;
    const t = T[String(this.props.type ?? 'A')[0]] || T.A;
    const sel = this.state.sel;
    return {
      c, t, mono: MONO, cur: OPTS[sel],
      opts: OPTS.map((o, i) => ({ ...o, checked: String(i === sel), border: i === sel ? '2px solid ' + c.ink : '1px solid ' + c.ln, pick: () => this.setState({ sel: i }) })),
      chips: [{ l: 'Shorter' }, { l: 'Different music' }, { l: 'Change the opening' }, { l: 'More people' }]
    };
  }
}
</script>
</body>
</html>
