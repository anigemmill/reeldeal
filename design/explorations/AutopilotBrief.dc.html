<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Autopilot — Brief</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&amp;family=Inter:wght@400;500;600&amp;family=Sora:wght@400;600;700&amp;family=DM+Sans:wght@400;500;600&amp;family=Manrope:wght@400;500;600;700;800&amp;family=Geist+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}a:hover{opacity:.85}
button{font:inherit;cursor:pointer}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; overflow: hidden; font-family: {{t.b}}; background: {{c.bg}}; color: {{c.ink}}; display: flex; flex-direction: column; font-size: 14px;">
  <header style="display: flex; justify-content: space-between; align-items: center; padding: 20px 20px 8px;">
    <button type="button" aria-label="Close" style="width: 44px; height: 44px; border-radius: 50%; border: 1px solid {{c.ln}}; background: {{c.sf}}; color: {{c.ink}}; display: flex; align-items: center; justify-content: center;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
    <span style="font-family: {{mono}}; font-size: 12px; color: {{c.mu}};">AUTOPILOT · STEP 2 OF 3</span>
    <span style="width: 44px;"></span>
  </header>

  <div style="flex: 1; overflow: hidden; padding: 8px 20px 0; display: flex; flex-direction: column; gap: 20px;">
    <h1 style="margin: 0; font-family: {{t.h}}; font-size: 34px; line-height: 1; letter-spacing: -0.03em; font-weight: 600;">What are we making?</h1>

    <div style="padding: 12px; border-radius: 18px; background: {{c.sf}}; border: 1px solid {{c.ln}}; display: flex; flex-direction: column; gap: 10px;">
      <div style="display: flex; justify-content: space-between; align-items: center;">
        <span style="font-weight: 600;">23 clips added</span>
        <a href="#" style="font-size: 13px; text-decoration: underline;">Add more</a>
      </div>
      <div style="display: flex; gap: 6px;">
        <sc-for list="{{thumbs}}" as="th" hint-placeholder-count="5">
          <div style="position: relative; flex: 1; height: 58px; border-radius: 10px; overflow: hidden;"><dc-import name="Scene" variant="{{th.v}}" hint-size="100%,100%"></dc-import></div>
        </sc-for>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px;">
      <span style="font-size: 13px; font-weight: 600;">Brand</span>
      <button type="button" style="display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: 16px; border: 1px solid {{c.ln}}; background: {{c.sf}}; color: {{c.ink}}; text-align: left;">
        <span style="width: 40px; height: 40px; border-radius: 12px; background: {{c.ac2}}; color: {{c.on2}}; display: flex; align-items: center; justify-content: center; font-family: {{t.h}}; font-weight: 700;">LL</span>
        <span style="flex: 1; display: flex; flex-direction: column; gap: 2px;"><span style="font-weight: 600;">Lakeside Lodge</span><span style="font-size: 12px; color: {{c.mu}};">Brand profile · fonts, colours, logo</span></span>
        <span aria-hidden="true" style="color: {{c.mu}};">›</span>
      </button>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px;">
      <span style="font-size: 13px; font-weight: 600;">Goal</span>
      <div style="display: flex; flex-wrap: wrap; gap: 8px;">
        <sc-for list="{{goals}}" as="g" hint-placeholder-count="4">
          <button type="button" onClick="{{g.pick}}" aria-pressed="{{g.pressed}}" style="padding: 10px 14px; min-height: 44px; border-radius: 999px; border: {{g.border}}; background: {{g.bg}}; color: {{g.fg}}; font-weight: 500;">{{g.l}}</button>
        </sc-for>
      </div>
    </div>

    <label style="display: flex; flex-direction: column; gap: 8px;">
      <span style="font-size: 13px; font-weight: 600;">Describe it</span>
      <textarea rows="3" style="resize: none; padding: 12px 14px; border-radius: 16px; border: 1px solid {{c.ln}}; background: {{c.sf}}; color: {{c.ink}}; font: inherit; line-height: 1.5;">A calm summer morning at the lodge. Kayaking, coffee on the deck, ending on the lake view. Push direct bookings.</textarea>
    </label>

    <div style="display: flex; gap: 12px;">
      <div style="flex: 1; display: flex; flex-direction: column; gap: 8px;">
        <span style="font-size: 13px; font-weight: 600;">Format</span>
        <div style="display: flex; gap: 4px; padding: 4px; border-radius: 14px; background: {{c.sf}}; border: 1px solid {{c.ln}};">
          <span style="flex: 1; padding: 8px 0; text-align: center; border-radius: 10px; background: {{c.ink}}; color: {{c.bg}}; font-family: {{mono}}; font-size: 12px;">9:16</span>
          <span style="flex: 1; padding: 8px 0; text-align: center; font-family: {{mono}}; font-size: 12px;">1:1</span>
          <span style="flex: 1; padding: 8px 0; text-align: center; font-family: {{mono}}; font-size: 12px;">16:9</span>
        </div>
      </div>
      <div style="flex: 1; display: flex; flex-direction: column; gap: 8px;">
        <span style="font-size: 13px; font-weight: 600;">Length</span>
        <div style="display: flex; gap: 4px; padding: 4px; border-radius: 14px; background: {{c.sf}}; border: 1px solid {{c.ln}};">
          <span style="flex: 1; padding: 8px 0; text-align: center; font-family: {{mono}}; font-size: 12px;">15s</span>
          <span style="flex: 1; padding: 8px 0; text-align: center; border-radius: 10px; background: {{c.ink}}; color: {{c.bg}}; font-family: {{mono}}; font-size: 12px;">30s</span>
          <span style="flex: 1; padding: 8px 0; text-align: center; font-family: {{mono}}; font-size: 12px;">60s</span>
        </div>
      </div>
    </div>
  </div>

  <div style="padding: 16px 20px 28px;">
    <a href="AutopilotWorking.dc.html" style="display: flex; justify-content: center; align-items: center; gap: 10px; padding: 18px; border-radius: 18px; background: {{c.ac}}; color: {{c.on}}; font-weight: 600; font-size: 16px;">Create 3 options
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"></path><polyline points="13 6 19 12 13 18"></polyline></svg>
    </a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"palette":{"editor":"enum","options":["01 · Cream / Blue / Orange","02 · June Bud / Orange / Dark Blue","03 · Tangerine / Pistachio / Retro Green","04 · Altitude","05 · Electric Blue / Orange / Charcoal","06 · Fold / Bone White / Blue"],"default":"01 · Cream / Blue / Orange","section":"Theme"},"mode":{"editor":"enum","options":["Light Workspace","Dark Studio"],"default":"Light Workspace","section":"Theme"},"type":{"editor":"enum","options":["A · Space Grotesk + Inter","B · Sora + DM Sans","C · Manrope"],"default":"A · Space Grotesk + Inter","section":"Theme"},"$preview":{"width":390,"height":844}}'>
const P={
'01':{L:{bg:'#F6EFE7',sf:'#FFFFFF',sf2:'#EFE4D8',ink:'#1E2533',mu:'#5A6275',ln:'#E2D6C9',ac:'#F4721E',on:'#1E2533',ac2:'#4D6080',on2:'#FFFFFF',tint:'#E9D9CA'},D:{bg:'#12151C',sf:'#1B202B',sf2:'#252B38',ink:'#F3ECE4',mu:'#A5ADBD',ln:'#2E3546',ac:'#F4721E',on:'#1E2533',ac2:'#8FA3C6',on2:'#12151C',tint:'#E9D9CA'}},
'02':{L:{bg:'#F7F3E9',sf:'#FFFFFF',sf2:'#EFE7D4',ink:'#12063F',mu:'#574F70',ln:'#E5DCC6',ac:'#1A0088',on:'#FFFFFF',ac2:'#FF5832',on2:'#12063F',tint:'#B4D34F'},D:{bg:'#0D0726',sf:'#170E3A',sf2:'#22184D',ink:'#F4EFE2',mu:'#ABA4C4',ln:'#2E2459',ac:'#B4D34F',on:'#12063F',ac2:'#FF5832',on2:'#0D0726',tint:'#B4D34F'}},
'03':{L:{bg:'#F4F3E4',sf:'#FFFFFF',sf2:'#E9E8CA',ink:'#0F2A1B',mu:'#4F5E54',ln:'#DEDDBF',ac:'#006732',on:'#FFFFFF',ac2:'#FE7A25',on2:'#0F2A1B',tint:'#E9E8CA'},D:{bg:'#0B140F',sf:'#121F18',sf2:'#1A2B21',ink:'#EEEDD6',mu:'#A3AE9F',ln:'#24382C',ac:'#FE7A25',on:'#0B140F',ac2:'#3FA36B',on2:'#0B140F',tint:'#E9E8CA'}},
'04':{L:{bg:'#F8F1F5',sf:'#FFFFFF',sf2:'#F2E6EE',ink:'#0B0838',mu:'#57546F',ln:'#E6D8E1',ac:'#0033FF',on:'#FFFFFF',ac2:'#977DFF',on2:'#0B0838',tint:'#F2E6EE'},D:{bg:'#08072B',sf:'#100E3D',sf2:'#1A1752',ink:'#F2E6EE',mu:'#ACA6CC',ln:'#26236A',ac:'#977DFF',on:'#08072B',ac2:'#5C7BFF',on2:'#08072B',tint:'#F2E6EE'}},
'05':{L:{bg:'#FFF6EF',sf:'#FFFFFF',sf2:'#FFE4D0',ink:'#191919',mu:'#5C5C5C',ln:'#F0DCCB',ac:'#2636F5',on:'#FFFFFF',ac2:'#FF5A00',on2:'#191919',tint:'#FFE4D0'},D:{bg:'#191919',sf:'#222222',sf2:'#2C2C2C',ink:'#F5F0EC',mu:'#A8A8A8',ln:'#363636',ac:'#FF5A00',on:'#191919',ac2:'#087BFF',on2:'#0B0B0B',tint:'#FFE4D0'}},
'06':{L:{bg:'#F5F5F5',sf:'#FFFFFF',sf2:'#ECECEC',ink:'#141414',mu:'#5E5E5E',ln:'#E3E3E3',ac:'#2860FF',on:'#FFFFFF',ac2:'#FF6500',on2:'#141414',tint:'#F7B34B'},D:{bg:'#101114',sf:'#18191D',sf2:'#222328',ink:'#F5F5F5',mu:'#A3A3A8',ln:'#2E2F35',ac:'#F7B34B',on:'#141414',ac2:'#5A85FF',on2:'#101114',tint:'#F7B34B'}}};
const T={A:{h:"'Space Grotesk', sans-serif",b:"'Inter', sans-serif"},B:{h:"'Sora', sans-serif",b:"'DM Sans', sans-serif"},C:{h:"'Manrope', sans-serif",b:"'Manrope', sans-serif"}};
const MONO="'Geist Mono', ui-monospace, monospace";
class Component extends DCLogic {
  constructor(p){ super(p); this.state = { goal: 'Drive bookings' }; }
  renderVals() {
    const pal = P[String(this.props.palette ?? '01').slice(0, 2)] || P['01'];
    const c = (this.props.mode ?? 'Light Workspace') === 'Dark Studio' ? pal.D : pal.L;
    const t = T[String(this.props.type ?? 'A')[0]] || T.A;
    const goals = ['Drive bookings', 'Promote an offer', 'Show the experience', 'Seasonal update'].map((l) => {
      const on = this.state.goal === l;
      return { l, pressed: String(on), bg: on ? c.ink : c.sf, fg: on ? c.bg : c.ink, border: on ? '1px solid ' + c.ink : '1px solid ' + c.ln, pick: () => this.setState({ goal: l }) };
    });
    return { c, t, mono: MONO, goals, thumbs: [{ v: 'lake' }, { v: 'dawn' }, { v: 'forest' }, { v: 'coast' }, { v: 'night' }] };
  }
}
</script>
</body>
</html>
