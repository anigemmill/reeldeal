<html lang="en">
<head>

<title>Autopilot — Building your video</title>

</head>
<body>
<x-dc>
<helmet>

<style>
body{margin:0}
a{color:inherit;text-decoration:none}a:hover{opacity:.85}
@keyframes orbit{to{transform:rotate(360deg)}}
@keyframes orbitBack{to{transform:rotate(-360deg)}}
.orb-a{animation:orbit 14s linear infinite}
.orb-b{animation:orbitBack 22s linear infinite}
@media (prefers-reduced-motion: reduce){.orb-a,.orb-b{animation:none}}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; overflow: hidden; font-family: {{t.b}}; background: {{c.bg}}; color: {{c.ink}}; display: flex; flex-direction: column; font-size: 14px;">
  <header style="display: flex; justify-content: center; padding: 32px 20px 0;">
    <span style="font-family: {{mono}}; font-size: 12px; color: {{c.mu}};">AUTOPILOT · STEP 3 OF 3</span>
  </header>

  <div style="display: flex; justify-content: center; padding: 36px 0 28px;">
    <div style="position: relative; width: 260px; height: 260px;" aria-hidden="true">
      <span style="position: absolute; inset: 0; border-radius: 50%; border: 1px solid {{c.ln}};"></span>
      <span style="position: absolute; inset: 40px; border-radius: 50%; border: 1px dashed {{c.ln}};"></span>
      <div class="orb-a" style="position: absolute; inset: 0;">
        <span style="position: absolute; left: 50%; top: -9px; margin-left: -9px; width: 18px; height: 18px; border-radius: 50%; background: {{c.ac}};"></span>
        <span style="position: absolute; left: 6px; bottom: 50px; width: 12px; height: 12px; border-radius: 50%; background: {{c.ac2}};"></span>
      </div>
      <div class="orb-b" style="position: absolute; inset: 40px;">
        <div style="position: absolute; right: -24px; top: 30px; width: 54px; height: 36px; border-radius: 9px; overflow: hidden; border: 2px solid {{c.bg}};"><div style="position: relative; width: 100%; height: 100%;"><dc-import name="Scene" variant="lake" hint-size="100%,100%"></dc-import></div></div>
        <div style="position: absolute; left: -20px; bottom: 26px; width: 54px; height: 36px; border-radius: 9px; overflow: hidden; border: 2px solid {{c.bg}};"><div style="position: relative; width: 100%; height: 100%;"><dc-import name="Scene" variant="dawn" hint-size="100%,100%"></dc-import></div></div>
      </div>
      <div style="position: absolute; inset: 82px; border-radius: 50%; background: {{c.ink}}; color: {{c.bg}}; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;">
        <span style="font-family: {{mono}}; font-size: 26px;">62%</span>
      </div>
    </div>
  </div>

  <div style="padding: 0 20px; display: flex; flex-direction: column; gap: 20px; flex: 1;">
    <div>
      <h1 style="margin: 0 0 8px; font-family: {{t.h}}; font-size: 32px; line-height: 1.02; letter-spacing: -0.03em; font-weight: 600;">Building your video</h1>
      <p style="margin: 0; color: {{c.mu}}; line-height: 1.5;">Usually under two minutes. You can leave this screen and we’ll let you know when it’s ready.</p>
    </div>
    <div role="progressbar" aria-label="Progress" aria-valuenow="62" aria-valuemin="0" aria-valuemax="100" style="height: 8px; border-radius: 999px; background: {{c.sf2}};">
      <div style="width: 62%; height: 8px; border-radius: 999px; background: {{c.ac}};"></div>
    </div>
    <ol style="margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 4px;">
      <sc-for list="{{steps}}" as="s" hint-placeholder-count="4">
        <li style="display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 14px; background: {{s.bg}};">
          <span style="flex: none; width: 26px; height: 26px; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: {{s.dotBg}}; color: {{s.dotFg}}; border: {{s.dotBorder}}; box-sizing: border-box; font-size: 12px;" aria-hidden="true">{{s.icon}}</span>
          <span style="flex: 1; font-weight: {{s.fw}}; color: {{s.fg}};">{{s.l}}</span>
          <span style="font-family: {{mono}}; font-size: 11px; color: {{c.mu}};">{{s.m}}</span>
        </li>
      </sc-for>
    </ol>
  </div>

  <div style="padding: 16px 20px 28px; display: flex; flex-direction: column; gap: 8px;">
    <a href="AutopilotReview.dc.html" style="display: flex; justify-content: center; padding: 18px; border-radius: 18px; background: {{c.sf}}; border: 1px solid {{c.ln}}; font-weight: 600;">Skip to results (prototype)</a>
  </div>
</div>
</x-dc>

</body>
</html>
