<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>App sidebar</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&amp;family=Inter:wght@400;500;600&amp;family=Geist+Mono:wght@400;500&amp;family=Instrument+Serif:ital@0;1&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<nav aria-label="App" style="width: 248px; min-height: 900px; box-sizing: border-box; padding: 18px 14px; background: #FFFFFF; border-right: 1px solid #DCE6F5; font-family: 'Inter', sans-serif; color: #1A1A1A; display: flex; flex-direction: column; gap: 18px; font-size: 14px;">
  <a href="W-Home.dc.html" style="display: flex; align-items: center; gap: 10px; padding: 4px 6px; font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 19px; color: #1A1A1A; text-decoration: none;">
    <span style="position: relative; width: 24px; height: 24px; display: inline-block;" aria-hidden="true">
      <span style="position: absolute; left: 0; top: 0; width: 16px; height: 16px; border-radius: 5px; background: linear-gradient(135deg, #007BFF 0%, #FFE6D0 30%, #FF5A00 55%, #6A3AA8 78%, #2038E2 100%);"></span>
      <span style="position: absolute; right: 0; bottom: 0; width: 16px; height: 16px; border-radius: 5px; border: 2px solid #1A1A1A; box-sizing: border-box;"></span>
    </span>
    Reeldeal
  </a>
  <button type="button" style="display: flex; align-items: center; gap: 10px; padding: 9px 10px; border-radius: 12px; border: 1px solid #DCE6F5; background: #F5F8FF; color: #1A1A1A; font: inherit; text-align: left; cursor: pointer;">
    <span style="width: 30px; height: 30px; border-radius: 9px; background: #2038E2; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 12px;">LL</span>
    <span style="flex: 1; display: flex; flex-direction: column;"><span style="font-weight: 600;">Lakeside Lodge</span><span style="font-size: 12px; color: #4B5563;">Brand workspace</span></span>
    <span aria-hidden="true" style="color: #4B5563;">⌄</span>
  </button>
  <a href="A-Generate.dc.html" style="display: flex; justify-content: center; align-items: center; gap: 8px; padding: 12px; border-radius: 12px; background: #FF5A00; color: #1A1A1A; font-weight: 600; text-decoration: none;">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>New video
  </a>
  <div style="display: flex; flex-direction: column; gap: 2px;">
    <sc-for list="{{items}}" as="n" hint-placeholder-count="7">
      <a href="{{n.href}}" aria-current="{{n.cur}}" style="display: flex; align-items: center; gap: 11px; padding: 10px 12px; border-radius: 10px; background: {{n.bg}}; color: {{n.fg}}; font-weight: {{n.fw}}; text-decoration: none;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{n.d}}"></path></svg>
        <span style="flex: 1;">{{n.l}}</span>
        <sc-if value="{{n.badge}}" hint-placeholder-val="{{false}}"><span style="padding: 2px 7px; border-radius: 999px; background: #FF5A00; color: #1A1A1A; font-family: 'Geist Mono', monospace; font-size: 10px;">{{n.b}}</span></sc-if>
      </a>
    </sc-for>
  </div>
  <div style="margin-top: auto; padding: 14px; border-radius: 14px; background: #EEF5FF; display: flex; flex-direction: column; gap: 12px;">
    <div style="display: flex; justify-content: space-between; align-items: center;"><span style="font-weight: 600;">Creator plan</span><a href="W-Pricing.dc.html" style="font-size: 12px; color: #2038E2; text-decoration: none; font-weight: 600;">Upgrade</a></div>
    <sc-for list="{{meters}}" as="m">
      <div>
        <div style="display: flex; justify-content: space-between; font-size: 12px; margin-bottom: 5px;"><span>{{m.l}}</span><span style="font-family: 'Geist Mono', monospace; color: #4B5563;">{{m.v}}</span></div>
        <div style="height: 5px; border-radius: 999px; background: #DCE6F5;"><div style="height: 5px; width: {{m.w}}; border-radius: 999px; background: {{m.c}};"></div></div>
      </div>
    </sc-for>
  </div>
  <div style="display: flex; align-items: center; gap: 10px; padding: 4px 6px;">
    <span style="width: 32px; height: 32px; border-radius: 50%; background: #1A1A1A; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 600;">AG</span>
    <span style="flex: 1; font-size: 13px;">[Your name]</span>
    <a href="Appearance.dc.html" aria-label="Settings" style="color: #4B5563;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"></path></svg></a>
  </div>
</nav>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":"enum","options":["Home","Library","Projects","Brands","Templates","Exports"],"default":"Library"},"$preview":{"width":260,"height":900}}'>
const ITEMS = [
  ['Home', '#', 'M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z'],
  ['Library', 'A-Library.dc.html', 'M4 4h7v7H4zM13 4h7v7h-7zM4 13h7v7H4zM13 13h7v7h-7z'],
  ['Projects', 'A-Storyboard.dc.html', 'M3 6h6l2 2h10v11H3z'],
  ['Brands', '#', 'M12 3l8 4v6c0 4-3.5 7-8 8-4.5-1-8-4-8-8V7z'],
  ['Templates', '#', 'M4 4h16v6H4zM4 14h7v6H4zM15 14h5v6h-5z'],
  ['Exports', 'A-Render.dc.html', 'M12 3v12M7 10l5 5 5-5M5 21h14']
];
class Component extends DCLogic {
  renderVals() {
    const act = this.props.active ?? 'Library';
    return {
      items: ITEMS.map(([l, href, d]) => ({ l, href, d, cur: l === act ? 'page' : 'false', bg: l === act ? '#EEF5FF' : 'transparent', fg: l === act ? '#2038E2' : '#1A1A1A', fw: l === act ? '600' : '400', badge: l === 'Exports', b: '1' })),
      meters: [
        { l: 'Videos', v: '14 of 20 left', w: '70%', c: '#2038E2' },
        { l: 'Media analysis', v: '6.5 of 10 hrs', w: '65%', c: '#007BFF' },
        { l: 'Storage', v: '212 of 500GB', w: '42%', c: '#8FC2FF' }
      ]
    };
  }
}
</script>
</body>
</html>
