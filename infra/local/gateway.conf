# LOCAL ONLY: routes /auth/v1/* to Supabase Auth, like the hosted Supabase API gateway.
server {
  listen 80;
  # The repo's email templates (supabase/templates), fetched by Supabase Auth when it sends mail.
  location /templates/ {
    alias /usr/share/nginx/templates/;
  }
  location /auth/v1/ {
    proxy_pass http://auth:9999/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host:54321;
    proxy_set_header X-Forwarded-Proto http;
  }
}
